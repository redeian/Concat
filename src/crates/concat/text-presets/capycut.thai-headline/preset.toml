# CapyCut: the Thai headline a clip opens on. Chonburi is the heavy display
# face the Thai press uses for a front page, and the black outline is what
# keeps it legible over a bright shot.
[style]
content = "พาดหัวข่าวใหญ่"
fontFamily = "Chonburi"
fontWeight = 400
fontSize = 0.135
color = "#FFFFFF"
strokeWidth = 0.013
strokeColor = "#000000"
shadow = true
lineHeight = 1.34
maxWidth = 0.88
